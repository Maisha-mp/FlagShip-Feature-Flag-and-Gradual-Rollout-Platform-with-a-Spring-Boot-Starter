server.port=8081
spring.application.name=flagship-demo

# FlagShip starter settings
flagship.project=checkout-app
flagship.server-url=http://localhost:8080
flagship.environment=PRODUCTION

# Polling is only the safety net now; changes arrive through the push stream
flagship.poll-interval=60s

# Actuator: show the FlagShip endpoint and the metrics
management.endpoints.web.exposure.include=health,metrics,flagship
management.endpoint.health.show-details=always