server.port=8080

spring.application.name=flagship-server

# Stop at once, even if apps keep a live (SSE) connection open
server.shutdown=immediate

# Java 21 virtual threads (from the plan)
spring.threads.virtual.enabled=true

# H2 file database, so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/flagship;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update tables from our entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Print the SQL while we build (REMOVE before the final submission)
spring.jpa.show-sql=true

# Show the message text in API errors
server.error.include-message=always

# How often the server pings connected apps over SSE
flagship.push.heartbeat=15s